name: Host logic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check installer syntax and isolated logic
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh install-input-modes.sh migrate-emmc.sh restore-sailfish.sh configure-user.sh tests/user-configure.sh tests/terminal-smoke.sh tests/sddm-session.sh
          python3 tests/download.py
          python3 tests/check_console.py
          python3 tests/terminal-lock.py
          python3 tests/input-modes.py
          python3 tests/emmc-config.py
          python3 tests/emmc-moves.py
          python3 tests/power-status.py
          python3 tests/plugin-archives.py
          python3 tests/plugin-install.py
          python3 tests/cellular-lock.py
          bash -n extras/install-user-hook.sh extras/install-4g.sh extras/install-desktop.sh
          bash tests/user-configure.sh
